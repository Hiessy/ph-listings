<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 24px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 1.3rem; color: #222; }
  .sort-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .sort-btns button { padding: 7px 14px; border: 2px solid #1a1aff; border-radius: 20px; background: #fff; color: #1a1aff; font-weight: 600; font-size: .82rem; cursor: pointer; transition: all .15s; }
  .sort-btns button.active { background: #1a1aff; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.12); display: flex; flex-direction: column; position: relative; transition: box-shadow .2s; }
  .card.my-vote { box-shadow: 0 0 0 3px #1a1aff, 0 2px 8px rgba(0,0,0,.15); }
  .card img { width: 100%; height: 200px; object-fit: cover; }
  .info { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  h3 { font-size: .9rem; color: #111; line-height: 1.3; }
  .addr { font-size: .82rem; color: #555; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { font-size: .82rem; font-weight: 600; padding: 3px 8px; border-radius: 5px; }
  .stat.price { background: #fff3cd; color: #856404; }
  .stat.sqm   { background: #d1ecf1; color: #0c5460; }
  .stat.rooms { background: #d4edda; color: #155724; }
  .num { position: absolute; top: 0; left: 0; background: #1a1aff; color: #fff; font-weight: 700; font-size: .85rem; padding: 4px 9px; border-radius: 0 0 8px 0; z-index: 1; }
  .rank-badge { position: absolute; top: 0; right: 0; font-size: 1.3rem; padding: 4px 8px; border-radius: 0 10px 0 8px; display: none; }
  .rank-badge.show { display: block; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a { font-size: .78rem; padding: 5px 10px; border-radius: 5px; text-decoration: none; font-weight: 500; }
  .links a:nth-child(1) { background: #ffe600; color: #333; }
  .links a:nth-child(2) { background: #34a853; color: #fff; }
  .links a:nth-child(3) { background: #4285f4; color: #fff; }
  .vote-row { margin-top: auto; display: flex; align-items: center; gap: 10px; }
  .vote-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 20px; border: 2px solid #ddd; background: #fff; cursor: pointer; font-size: .88rem; font-weight: 600; color: #555; transition: all .15s; }
  .vote-btn:hover { border-color: #1a1aff; color: #1a1aff; }
  .vote-btn.voted { background: #1a1aff; border-color: #1a1aff; color: #fff; }
  .vote-count { font-size: .82rem; color: #888; }

let votes = {};
let currentSort = 'route';

function fmtPrice(p) {
  return 'US$' + p.toLocaleString('es-AR');
}

function renderGrid() {
  const myVote = localStorage.getItem('myVote');
  const sorted = [...LISTINGS];
  if (currentSort === 'votes') sorted.sort((a,b) => (votes[b.id]||0) - (votes[a.id]||0));
  if (currentSort === 'price') sorted.sort((a,b) => a.price - b.price);
  if (currentSort === 'sqm')   sorted.sort((a,b) => b.sqm - a.sqm);

  document.getElementById('grid').innerHTML = sorted.map((l, idx) => {
    const count    = votes[l.id] || 0;
    const isMyVote = myVote === l.id;
    const medals   = ['🥇','🥈','🥉'];
    const showMedal = currentSort === 'votes' && idx < 3 && count > 0;
    return `
    <div class="card${isMyVote ? ' my-vote' : ''}">
      <div class="num">${l.n}</div>
      ${showMedal ? `<div class="rank-badge show">${medals[idx]}</div>` : ''}
      <img src="${l.img}" alt="${l.title}" loading="lazy">
      <div class="info">
        <h3>${l.title}</h3>
        <p class="addr">📍 ${l.address}</p>
        <div class="stats">
          <span class="stat price">${fmtPrice(l.price)}</span>
          <span class="stat sqm">${l.sqm} m²</span>
          <span class="stat rooms">${l.rooms} amb.</span>
        </div>
        <div class="links">
          <a href="${l.url}" target="_blank">MercadoLibre</a>
          <a href="https://www.google.com/maps?q=${l.lat},${l.lon}" target="_blank">Maps</a>
          <a href="https://maps.google.com/maps?q=&layer=c&cbll=${l.lat},${l.lon}" target="_blank">Street View</a>
        </div>
        <div class="vote-row">
          <button class="vote-btn${isMyVote ? ' voted' : ''}" onclick="castVote('${l.id}')">
            ${isMyVote ? '⭐ Mi voto' : '☆ Votar'}
          </button>
          <span class="vote-count">${count} ${count === 1 ? 'voto' : 'votos'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function castVote(id) {
  const prev = localStorage.getItem('myVote');
  if (prev === id) return;
  const updates = {};
  if (prev) updates[`votes/${prev}`] = Math.max(0, (votes[prev]||0) - 1);
  updates[`votes/${id}`] = (votes[id]||0) + 1;
  db.ref().update(updates);
  localStorage.setItem('myVote', id);
}

function setSort(mode) {
  currentSort = mode;
  ['Route','Votes','Price','Sqm'].forEach(s =>
    document.getElementById('btn'+s).classList.toggle('active', mode === s.toLowerCase())
  );
  renderGrid();
}

votesRef.on('value', snap => {
  votes = snap.val() || {};
  renderGrid();
});
